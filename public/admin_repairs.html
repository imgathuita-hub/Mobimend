<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobimend Admin - Repair Bookings</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: #f6f7fb;
      color: #1f2933;
    }
    header {
      background: #1766c5;
      color: #fff;
      padding: 20px;
    }
    header h1 { margin: 0; font-family: 'Montserrat', sans-serif; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .row input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d7dbe3;
      flex: 1;
      min-width: 180px;
    }
    button {
      background: #1766c5;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #6b7280;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #eef0f4;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f1f5f9; font-weight: 700; }
    .small { font-size: 0.9rem; color: #556070; }
    .actions button { margin-right: 6px; }
    .token-box { font-family: monospace; word-break: break-all; }
    .status-pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: #e5efff;
      color: #1d4ed8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mobimend Repair Bookings</h1>
    <div class="small">Login, then manage repair bookings</div>
  </header>

  <div class="container">
    <div class="card">
      <h3>Admin Login</h3>
      <div class="row">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button id="loginBtn">Login</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <input id="tokenInput" type="text" placeholder="Paste token here if you already have one">
        <button id="saveTokenBtn" class="secondary">Save Token</button>
      </div>
      <div class="small" style="margin-top:8px;">Current token:</div>
      <div id="tokenDisplay" class="token-box small">Not set</div>
    </div>

    <div class="card">
      <h3>Bookings</h3>
      <button id="refreshBtn">Refresh</button>
      <table style="margin-top:12px;">
        <thead>
          <tr>
            <th>Booked</th>
            <th>Customer</th>
            <th>Device</th>
            <th>Repair</th>
            <th>Notes</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookingBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:4000/api";
    const tokenKey = "mobimend_token";

    const tokenDisplay = document.getElementById("tokenDisplay");
    const tokenInput = document.getElementById("tokenInput");

    const setToken = (token) => {
      localStorage.setItem(tokenKey, token);
      tokenDisplay.textContent = token || "Not set";
    };

    const getToken = () => localStorage.getItem(tokenKey);

    setToken(getToken() || "");

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) {
        alert("Email and password are required");
        return;
      }
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "Login failed");
        return;
      }
      setToken(data.token);
      alert("Logged in");
    });

    document.getElementById("saveTokenBtn").addEventListener("click", () => {
      setToken(tokenInput.value.trim());
    });

    const updateStatus = async (id, status) => {
      const token = getToken();
      if (!token) return alert("Login first");
      const res = await fetch(`${API_BASE}/repairs/${id}/status`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ status })
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || "Update failed");
        return;
      }
      loadBookings();
    };

    const deleteBooking = async (id) => {
      const token = getToken();
      if (!token) return alert("Login first");
      if (!confirm("Delete this booking?")) return;
      const res = await fetch(`${API_BASE}/repairs/${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || "Delete failed");
        return;
      }
      loadBookings();
    };

    const loadBookings = async () => {
      const token = getToken();
      if (!token) return;
      const res = await fetch(`${API_BASE}/repairs`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const items = await res.json();
      const body = document.getElementById("bookingBody");
      body.innerHTML = "";
      items.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="small">${new Date(item.bookingDate).toLocaleString()}</td>
          <td>
            <div><strong>${item.customerName || ""}</strong></div>
            <div class="small">${item.phoneNumber || ""}</div>
            <div class="small">${item.email || ""}</div>
          </td>
          <td>${item.deviceModel || ""}</td>
          <td>${item.repairType || ""}</td>
          <td class="small">${item.issueDescription || ""}</td>
          <td><span class="status-pill">${item.status || "Pending"}</span></td>
          <td class="actions">
            <button data-action="complete">Mark Complete</button>
            <button data-action="pending" class="secondary">Mark Pending</button>
            <button data-action="delete" class="secondary">Delete</button>
          </td>
        `;
        row.querySelector('[data-action="complete"]').addEventListener("click", () => updateStatus(item._id, "Completed"));
        row.querySelector('[data-action="pending"]').addEventListener("click", () => updateStatus(item._id, "Pending"));
        row.querySelector('[data-action="delete"]').addEventListener("click", () => deleteBooking(item._id));
        body.appendChild(row);
      });
    };

    document.getElementById("refreshBtn").addEventListener("click", loadBookings);
    loadBookings();
  </script>
</body>
</html>
